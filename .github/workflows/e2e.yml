name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    needs: [ ]  # or: [ Backend Tests ] if you want to require unit tests first

    services:
      postgres:
        image: postgres:16
        ports: [ '5432:5432' ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jardin_e2e
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jardin_e2e
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:5001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Install root deps (Next + Playwright)
      - name: Install root deps
        run: npm ci

      # Install backend deps
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # Prepare DB (prisma generate + migrate + optional seed)
      - name: Prepare DB
        working-directory: backend
        run: |
          npm run prisma:generate
          npm run prisma:migrate -- --name e2e || true
          npm run seed || true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run Playwright — your playwright.config.cjs (at root) starts backend+Next automatically
      - name: Run E2E tests
        run: npx playwright test --config=playwright.config.cjs

      # Upload HTML report if failing
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
