name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jardin_e2e
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jardin_e2e
      NODE_ENV: test
      # Force the frontend to call the backend on 127.0.0.1 (no IPv6 DNS weirdness)
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5001
      # Disable auth-required tests in CI (they’re flaky without seeded users / emails)
      E2E_AUTH: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Install root deps (Next + Playwright runner)
      - name: Install root deps
        run: npm ci

      # --- Backend prep ---
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply schema & seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npx prisma migrate deploy || npx prisma db push
          npm run seed || true

      - name: Sanity check counts
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          node -e "const {PrismaClient}=require('@prisma/client');(async()=>{const p=new PrismaClient();console.log(await p.garden.count(), await p.gardener.count(), await p.user.count());await p.$disconnect();})();"

      # --- Frontend build (faster + stabler than dev) ---
      - name: Build Next.js
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        # Playwright will start backend + frontend via playwright.config.cjs webServer[]
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload Playwright HTML report (on fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
