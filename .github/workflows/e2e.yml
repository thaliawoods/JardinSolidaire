name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jardin_e2e
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jardin_e2e
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5001
      E2E_AUTH: "0"          # keep auth tests skipped in CI
      PORT_FRONT: "3000"
      PORT_BACK: "5001"
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: "Install root deps"
        run: npm ci

      - name: "Install backend deps"
        working-directory: backend
        run: npm ci

      - name: "Generate Prisma client"
        working-directory: backend
        run: npx prisma generate

      - name: "Apply schema (deploy or push)"
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npx prisma migrate deploy || npx prisma db push

      - name: "Seed DB"
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run seed || true

      - name: "Sanity: print row counts"
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          node -e "const {PrismaClient}=require('@prisma/client');(async()=>{const p=new PrismaClient();console.log('counts:',{gardens:await p.garden.count(),gardeners:await p.gardener.count(),users:await p.user.count()});await p.$disconnect();})();"

      - name: "Install Playwright browsers"
        run: npx playwright install --with-deps

      - name: "Run E2E tests"
        run: npx playwright test --config=playwright.config.cjs --reporter=html,line

      - name: "Upload Playwright report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: "Upload raw test-results"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
