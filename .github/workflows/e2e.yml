name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ '5432:5432' ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jardin_e2e
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jardin_e2e
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:5001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: "Install root deps"
        run: npm ci

      - name: "Install backend deps"
        working-directory: backend
        run: npm ci

      - name: "Generate Prisma client"
        working-directory: backend
        run: npx prisma generate

      - name: "Apply schema (deploy or push)"
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npx prisma migrate deploy || npx prisma db push

      - name: "Seed DB"
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run seed || true

      - name: "Sanity check: row counts"
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          node -e "const {PrismaClient}=require('@prisma/client');(async()=>{const p=new PrismaClient();console.log({gardens:await p.garden.count(), gardeners:await p.gardener.count(), users:await p.user.count()});await p.$disconnect();})();"

      - name: "Install Playwright browsers"
        run: npx playwright install --with-deps

      - name: "Run E2E tests"
        run: npx playwright test --config=playwright.config.cjs
